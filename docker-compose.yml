version: "3.8"

services:
  # ==================== INFRAESTRUTURA ====================
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    ports:
      - "9002:9000" # API
      - "9003:9001" # Console Web UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: crm
      MYSQL_USER: crmuser
      MYSQL_PASSWORD: crmpass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== API C# (CRM) ====================
  api:
    build:
      context: ./crm
      dockerfile: Dockerfile
    container_name: crm-api
    restart: always
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=mysql;Database=crm;User=crmuser;Password=crmpass;
      - CloudflareR2__ServiceURL=http://minio:9000
      - CloudflareR2__AccessKeyId=minioadmin
      - CloudflareR2__SecretAccessKey=minioadmin123
      - CloudflareR2__BucketName=crm-files
      - CloudflareR2__PublicUrl=http://localhost:9002/crm-files
      # URL da API de IA (acessível apenas internamente)
      - AI_API_URL=http://ai-api:8000
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - crm-network

  # ==================== API PYTHON (AI) ====================
  # Esta API NÃO expõe portas para o host - acessível apenas via rede interna
  ai-api:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: ai-api
    restart: always
    # SEM "ports:" - não acessível externamente, apenas pela rede interna
    networks:
      - crm-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  crm-network:
    driver: bridge

volumes:
  db_data:
  minio_data:
